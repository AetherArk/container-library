name: Boltz2 CPU tests
on:
  push:
    paths: ['cofolding/**', 'run_cofold.py', 'scripts/**', 'tests/**', '.github/workflows/boltz2*.yml']
  pull_request:
    paths: ['cofolding/**', 'run_cofold.py', 'scripts/**', 'tests/**', '.github/workflows/boltz2*.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r cofolding/boltz2/requirements-host.txt
      - run: python scripts/test_local.py --suite cpu

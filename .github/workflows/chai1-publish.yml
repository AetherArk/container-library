name: Publish Chai-1 candidate to GHCR
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Explicit container release tag; use a new tag for each release
        required: true
        default: 0.6.1-worker-rc1
        type: string
permissions:
  contents: read
concurrency:
  group: chai1-publish-${{ inputs.image_tag }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate release tag and select package
        shell: bash
        run: |-
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^0\.6\.1-worker-[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]
          (( ${#RELEASE_TAG} <= 128 ))
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/chai1" >> "$GITHUB_ENV"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
      - name: CPU capability tests
        shell: bash
        run: |-
          set -euo pipefail
          python -m pip install 'numpy>=2,<3' 'PyYAML>=6,<7' rdkit gemmi
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m unittest discover -s cofolding/chai1/tests -p 'test_*.py' -v
      - name: Make space on the disposable hosted runner
        shell: bash
        run: |-
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          python -c 'import shutil; assert shutil.disk_usage("/").free >= 50 * 2**30, "Need 50 GiB free for image build/export"'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build labeled release image
        shell: bash
        run: |-
          set -euo pipefail
          docker buildx build --platform linux/amd64 --load \
            --build-context common=cofolding/common \
            --build-arg CONTAINER_REVISION="$GITHUB_SHA" \
            --build-arg CONTAINER_VERSION="$RELEASE_TAG" \
            --tag "$IMAGE:$RELEASE_TAG" cofolding/chai1
      - name: Installed-image checks before publication
        shell: bash
        run: |-
          set -euo pipefail
          CANDIDATE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/chai1:$RELEASE_TAG"
          docker run --rm "$CANDIDATE" --help
          docker run --rm --entrypoint cofold-throughput "$CANDIDATE" --help
          docker run --rm --entrypoint python "$CANDIDATE" -c \
            "import chai_lab, torch, numpy, rdkit, gemmi; assert chai_lab.__version__ == '0.6.1', chai_lab.__version__; assert torch.__version__.startswith('2.11.0'), torch.__version__; import resident.worker, resident.engine; print('imports ok')"
          docker run --rm --entrypoint id "$CANDIDATE" -u | grep -qx 1000
          docker run --rm --entrypoint pwd "$CANDIDATE" | grep -qx /work
          test "$(docker image inspect "$CANDIDATE" --format '{{ index .Config.Labels "ai.aetherark.chai1.model_revision" }}')" = chaiassets-chai1-inference-depencencies
          if docker run --rm --entrypoint python "$CANDIDATE" /opt/cofold/fetch_assets.py --assets /tmp/absent --offline; then
            echo 'offline asset verification must fail closed on an empty directory' >&2; exit 1
          fi
      - name: Authenticate with the workflow token
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |-
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Push and resolve registry digest
        shell: bash
        run: |-
          set -euo pipefail
          docker push "$IMAGE:$RELEASE_TAG" | tee "$RUNNER_TEMP/chai1-push.log"
          python - <<'PY'
          import os, pathlib, re
          text = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'chai1-push.log').read_text()
          values = re.findall(r'digest: (sha256:[0-9a-f]{64})', text)
          assert len(values) == 1, 'Missing or ambiguous registry digest'
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('PUBLISHED_IMAGE=' + os.environ['IMAGE'] + '@' + values[0] + '\n')
          PY
      - name: Pull and check the published digest
        shell: bash
        run: |-
          set -euo pipefail
          docker pull "$PUBLISHED_IMAGE"
          docker run --rm "$PUBLISHED_IMAGE" --help
          docker run --rm --entrypoint cofold-throughput "$PUBLISHED_IMAGE" --help
          docker run --rm --entrypoint python "$PUBLISHED_IMAGE" -c \
            "import chai_lab, torch; assert chai_lab.__version__ == '0.6.1'; assert torch.__version__.startswith('2.11.0'); import resident.worker, resident.engine; print('imports ok')"
          actual=$(docker image inspect "$PUBLISHED_IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          [[ "$actual" == "$GITHUB_SHA" ]]
          printf 'Published and pulled: `%s`\n\nSource revision: `%s`\n\nCPU/image checks only; no weights downloaded; GPU evidence is pending.\n\nFirst publication is private by default; configure package visibility before anonymous-pull verification.\n' "$PUBLISHED_IMAGE" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove registry credentials
        if: always()
        shell: bash
        run: |-
          if [[ -f "${DOCKER_CONFIG:-}/config.json" ]]; then
            docker logout ghcr.io
          fi
